$kind: http-request
description: |-
  From configs/sink/bpjsk-postgres-sink.json.
method: PUT
url: '{{CONNECT_URL}}/connectors/bpjsk-postgres-sink/config'
order: 3000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
        "connector.class": "io.debezium.connector.jdbc.JdbcSinkConnector",
        "tasks.max": "2",
        "topics": "mssql-bpjsk-cdc.bpjsk_poc.dbo.BPJSClaim.to-pg,mssql-bpjsk-cdc.bpjsk_poc.dbo.BPJSMembership.to-pg,mssql-bpjsk-cdc.bpjsk_poc.dbo.BPJSMonthlyContribution.to-pg",
        "connection.url": "jdbc:postgresql://{{PG_SINK_HOST}}:{{PG_SINK_PORT}}/{{PG_SINK_DB}}?stringtype=unspecified",
        "connection.username": "{{PG_SINK_USER}}",
        "connection.password": "{{PG_SINK_PASSWORD}}",
        "insert.mode": "upsert",
        "primary.key.mode": "record_key",
        "delete.enabled": "true",
        "schema.evolution": "none",
        "collection.name.format": "${topic}",
        "errors.tolerance": "all",
        "errors.log.enable": "true",
        "errors.deadletterqueue.topic.name": "dlq.bpjsk-replication",
        "errors.deadletterqueue.topic.replication.factor": "1",
        "errors.deadletterqueue.context.headers.enable": "true",
        "transforms": "unwrap,dropLogin,routeClaim,routeMembership,routeContribution,renameClaimValue,renameClaimKey,renameMembershipValue,renameMembershipKey,renameContributionValue,renameContributionKey",
        "transforms.unwrap.type": "io.debezium.transforms.ExtractNewRecordState",
        "transforms.unwrap.delete.tombstone.handling.mode": "tombstone",
        "transforms.dropLogin.type": "org.apache.kafka.connect.transforms.ReplaceField$Value",
        "transforms.dropLogin.exclude": "db_login",
        "transforms.routeClaim.type": "org.apache.kafka.connect.transforms.RegexRouter",
        "transforms.routeClaim.regex": "mssql-bpjsk-cdc\\.bpjsk_poc\\.dbo\\.BPJSClaim\\.to-pg",
        "transforms.routeClaim.replacement": "bpjs_claim",
        "transforms.routeMembership.type": "org.apache.kafka.connect.transforms.RegexRouter",
        "transforms.routeMembership.regex": "mssql-bpjsk-cdc\\.bpjsk_poc\\.dbo\\.BPJSMembership\\.to-pg",
        "transforms.routeMembership.replacement": "bpjs_membership",
        "transforms.routeContribution.type": "org.apache.kafka.connect.transforms.RegexRouter",
        "transforms.routeContribution.regex": "mssql-bpjsk-cdc\\.bpjsk_poc\\.dbo\\.BPJSMonthlyContribution\\.to-pg",
        "transforms.routeContribution.replacement": "bpjs_monthly_contribution",
        "transforms.renameClaimValue.type": "org.apache.kafka.connect.transforms.ReplaceField$Value",
        "transforms.renameClaimValue.renames": "ClaimID:claim_id,MembershipID:membership_id,ClaimNumber:claim_number,ProgramType:program_type,ClaimDate:claim_date,ReasonDescription:reason_description,DisbursedAmount:disbursed_amount,ClaimStatus:claim_status,ApprovedAt:approved_at,CreatedAt:created_at",
        "transforms.renameClaimKey.type": "org.apache.kafka.connect.transforms.ReplaceField$Key",
        "transforms.renameClaimKey.renames": "ClaimID:claim_id",
        "transforms.renameMembershipValue.type": "org.apache.kafka.connect.transforms.ReplaceField$Value",
        "transforms.renameMembershipValue.renames": "MembershipID:membership_id,EmployeeID:employee_id,BPJSNumber:bpjs_number,NIK:nik,FullName:full_name,EnrollmentDate:enrollment_date,WorkRiskGroup:work_risk_group,IsActive:is_active,CreatedAt:created_at",
        "transforms.renameMembershipKey.type": "org.apache.kafka.connect.transforms.ReplaceField$Key",
        "transforms.renameMembershipKey.renames": "MembershipID:membership_id",
        "transforms.renameContributionValue.type": "org.apache.kafka.connect.transforms.ReplaceField$Value",
        "transforms.renameContributionValue.exclude": "TotalAmount",
        "transforms.renameContributionValue.renames": "ContributionID:contribution_id,MembershipID:membership_id,PeriodMonth:period_month,PeriodYear:period_year,BaseWage:base_wage,JHTEmployee:jht_employee,JHTEmployer:jht_employer,JKKEmployer:jkk_employer,JKMEmployer:jkm_employer,JPEmployee:jp_employee,JPEmployer:jp_employer,PaymentStatus:payment_status,PaidAt:paid_at,CreatedAt:created_at",
        "transforms.renameContributionKey.type": "org.apache.kafka.connect.transforms.ReplaceField$Key",
        "transforms.renameContributionKey.renames": "ContributionID:contribution_id",
        "key.converter": "org.apache.kafka.connect.json.JsonConverter",
        "key.converter.schemas.enable": "true",
        "value.converter": "org.apache.kafka.connect.json.JsonConverter",
        "value.converter.schemas.enable": "true",
        "predicates": "isClaim,isMembership,isContribution",
        "predicates.isClaim.type": "org.apache.kafka.connect.transforms.predicates.TopicNameMatches",
        "predicates.isClaim.pattern": "bpjs_claim",
        "predicates.isMembership.type": "org.apache.kafka.connect.transforms.predicates.TopicNameMatches",
        "predicates.isMembership.pattern": "bpjs_membership",
        "predicates.isContribution.type": "org.apache.kafka.connect.transforms.predicates.TopicNameMatches",
        "predicates.isContribution.pattern": "bpjs_monthly_contribution",
        "transforms.renameClaimValue.predicate": "isClaim",
        "transforms.renameClaimKey.predicate": "isClaim",
        "transforms.renameMembershipValue.predicate": "isMembership",
        "transforms.renameMembershipKey.predicate": "isMembership",
        "transforms.renameContributionValue.predicate": "isContribution",
        "transforms.renameContributionKey.predicate": "isContribution"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('HTTP 200/201', () => pm.expect(pm.response.code, pm.response.text().slice(0, 800)).to.be.oneOf([200, 201]));
