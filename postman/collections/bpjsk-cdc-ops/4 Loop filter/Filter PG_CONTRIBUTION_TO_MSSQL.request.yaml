$kind: http-request
method: POST
url: '{{KSQLDB_URL}}/ksql'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "ksql": "CREATE OR REPLACE STREAM pg_contribution_to_mssql\n  WITH (KAFKA_TOPIC='pg-bpjsk-cdc.public.bpjs_monthly_contribution.to-mssql', KEY_FORMAT='KAFKA', VALUE_FORMAT='KAFKA') AS\n  SELECT k, CASE WHEN v LIKE '{%' THEN CASE WHEN EXTRACTJSONFIELD(v, '$.payload.op') = 'd' THEN '{\"schema\":{\"type\":\"struct\",\"name\":\"bpjsk.delete.Envelope\",\"optional\":false,\"fields\":[{\"type\":\"struct\",\"optional\":true,\"field\":\"before\",\"fields\":[]},{\"type\":\"struct\",\"optional\":true,\"field\":\"after\",\"fields\":[]},{\"type\":\"string\",\"optional\":false,\"field\":\"op\"}]},\"payload\":{\"before\":{},\"after\":null,\"op\":\"d\"}}' ELSE v END ELSE v END AS v\n  FROM pg_contribution_raw\n  WHERE CASE WHEN v LIKE '{%' THEN COALESCE(LCASE(NULLIF(EXTRACTJSONFIELD(v, '$.payload.after.db_login'), 'null')), '')\n                               <> LCASE('${PG_SINK_USER}') ELSE true END;",
      "streamsProperties": {
        "auto.offset.reset": "earliest"
      },
      "sessionVariables": {
        "PG_SINK_USER": "{{PG_SINK_USER}}",
        "MSSQL_SINK_USER": "{{MSSQL_SINK_USER}}"
      }
    }
